<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Web -->
  <title>Manifest — The website & app framework that thinks like you do.</title>
  <meta name="description" content="Supercharge HTML for rapid, feature-rich website and web app development.">
  <meta name="author" content="Andrew Matlock">
  <meta name="robots" content="index, follow">
  <meta name="googlebot" content="index, follow">
  <meta name="google" content="notranslate">
  <link rel="canonical" href="https://manifestx.dev/">
  <link rel="icon" href="/favicon.ico" sizes="any">

  <!-- Preconnect to Google Fonts CDN for faster font loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Manifest">
  <meta property="og:title" content="Manifest — The website & app framework that thinks like you do.">
  <meta property="og:description" content="Supercharge HTML for rapid, feature-rich website and web app development.">
  <meta property="og:url" content="https://manifestx.dev/">
  <meta property="og:image" content="https://manifestx.dev/assets/icons/512x512.png">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Manifest — The website & app framework that thinks like you do.">
  <meta name="twitter:description" content="Supercharge HTML for rapid, feature-rich website and web app development.">
  <meta name="twitter:image" content="https://manifestx.dev/assets/icons/512x512.png">

  <!-- Structured data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Manifest",
    "description": "Supercharge HTML for rapid, feature-rich website and web app development.",
    "url": "https://manifestx.dev/",
    "applicationCategory": "DeveloperApplication",
    "operatingSystem": "Any",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "author": { "@type": "Person", "name": "Andrew Matlock", "url": "https://andrewmatlock.com" },
    "license": "https://manifestx.dev/docs/resources/license",
    "codeRepository": "https://github.com/Manifest-X/Manifest"
  }
  </script>

  <!-- Web App & Manifest -->
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="/manifest.json">

  <!-- Styles -->
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Lexend+Exa&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Lexend+Exa&display=swap">
  </noscript>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mnfst@0.5.115/lib/manifest.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mnfst@0.5.115/lib/manifest.code.min.css">
  <link rel="stylesheet" href="/manifest.theme.css">

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/appwrite@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/mnfst@0.5.115/lib/manifest.min.js" data-tailwind data-version="0.5.115"></script>
  <script src="/scripts/hero-editor.js" defer></script>
  <script src="/scripts/console-message.js" defer></script>

</head>

<body x-data="{
  init() {
    const savedDirection = localStorage.getItem('manifest-direction') || 'auto';
    document.documentElement.setAttribute('dir', savedDirection);
  }
}" class="bg-surface-1">

  <x-header></x-header>

  <main class="pt-[69px] px-viewport-padding dark:bg-surface-1" :class="$route === '/' ? 'bg-surface-1' : ''">

    <!-- Home page -->
    <x-home x-route="/"></x-home>

    <!-- Documentation pages -->
    <x-docs x-route="/docs, /docs/*"></x-docs>

  </main>

  <!-- Footer (visible on every route) -->
  <x-footer x-route="/"></x-footer>

</body>

</html>
