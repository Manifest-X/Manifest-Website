<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Manifest</title>
  <meta name="description" content="Supercharge HTML for rapid, feature-rich website and web app development.">
  <meta name="author" content="Andrew Matlock">
  <meta name="robots" content="index, follow">
  <meta name="googlebot" content="index, follow">
  <meta name="google" content="notranslate">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/Manrope.woff2" crossorigin>

  <!-- Web App & Manifest -->
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="/manifest.json">

  <!-- Styles -->
  <link rel="stylesheet" href="https://cdn.manifestx.dev/npm/mnfst@0.5.194/lib/manifest.min.css">
  <link rel="stylesheet" href="https://cdn.manifestx.dev/npm/mnfst@0.5.194/lib/manifest.code.min.css">
  <link rel="stylesheet" href="/manifest.theme.css">

  <!-- Scripts -->
  <script src="https://cdn.manifestx.dev/npm/appwrite@latest" defer></script>
  <script src="https://cdn.manifestx.dev/npm/mnfst@0.5.194/lib/manifest.min.js" data-tailwind data-version="0.5.194"></script>
  <script src="/scripts/payments-demo.js" defer></script>
  <script src="/scripts/hero-editor.js" defer></script>
  <script src="/scripts/console-message.js" defer></script>
  <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token":"0aee08ae352b431ebdc403752ba2ac41"}'></script>

</head>

<body x-data="{
  init() {
    const savedDirection = localStorage.getItem('manifest-direction') || 'auto';
    document.documentElement.setAttribute('dir', savedDirection);
  }
}" class="bg-surface-1">

  <a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:top-3 focus:left-3 focus:z-10 focus:px-4 focus:py-2 focus:bg-surface-1 focus:border focus:border-line focus:rounded-full">Skip to content</a>

  <x-header></x-header>
  <x-docs-search></x-docs-search>
  <x-docs-nav></x-docs-nav>

  <main id="main" class="pt-[69px] px-viewport-padding dark:bg-surface-1" :class="$route === '/' ? 'bg-surface-1' : ''">

    <!-- Home page -->
    <x-home x-route="/"></x-home>

    <!-- Documentation pages -->
    <x-docs x-route="docs" intro="Everything you need to build with Manifest — setup guides, plugins, pre-styled elements, and reference."></x-docs>

  </main>

  <!-- Footer (visible on every route) -->
  <x-footer x-route="/"></x-footer>

</body>

</html>
