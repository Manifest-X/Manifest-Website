  <meta name="googlebot" content="index, follow">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/Manrope.woff2" crossorigin>

  <!-- Web App & Manifest -->

  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

  <!-- Styles -->

  <script src="/scripts/console-message.js" defer></script>

  <!-- Payments docs demo provider ("mockpay"). Powers the live frames in
       /docs/core-plugins/payments: stubs the fn.test endpoints declared in
       manifest.json and simulates popup purchases — no real charges, and
       redirect clicks report their destination instead of navigating.
       Inert until the pinned mnfst version ships the payments plugin. -->
  <script>
    (function () {
      let credits = 42, plan = 'pro';
      const realFetch = window.fetch.bind(window);
      window.fetch = async (url, opts) => {
        const u = String(url);
        if (u.indexOf('https://fn.test/pay') === 0) {
          const body = JSON.parse(opts.body);
          if (body.context && body.context.preferMode === 'overlay') {
            return { ok: true, json: async () => ({ mode: 'overlay', provider: 'mockpay', params: { ref: body.ref } }) };
          }
          return { ok: true, json: async () => ({ mode: 'redirect', url: 'https://demo.checkout/' + body.ref }) };
        }
        if (u.indexOf('https://fn.test/state') === 0) {
          return { ok: true, json: async () => ({ plan, status: 'active', credits }) };
        }
        return realFetch(url, opts);
      };
      document.addEventListener('alpine:init', () => {
        if (!window.ManifestPayments || !window.ManifestPaymentsAdapters) return; // plugin not in this mnfst version yet
        window.ManifestPayments.setNavigate((u) => console.info('[payments demo] would navigate to:', u));
        window.ManifestPaymentsAdapters.register('mockpay', {
          supportsOverlay: true,
          async open({ params }) {
            if (params && params.ref === 'credits-1000') credits += 1000;
            if (params && params.ref === 'pro-upgrade') { plan = 'pro'; credits += 1000; }
            return { status: 'complete' };
          }
        });
      });
    })();
  </script>

  <!-- Cloudflare Web Analytics — lets us report manifestx.dev traffic (incl.
       badge clickthroughs, attributed by referrer) alongside hosted-site stats. -->
  <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token":"0aee08ae352b431ebdc403752ba2ac41"}'></script>

</head>

<body x-data="{
  init() {
    const savedDirection = localStorage.getItem('manifest-direction') || 'auto';
    document.documentElement.setAttribute('dir', savedDirection);
  }
}" class="bg-surface-1">

  <x-header></x-header>

  <main class="pt-[69px] px-viewport-padding dark:bg-surface-1" :class="$route === '/' ? 'bg-surface-1' : ''">

    <!-- Home page -->
    <x-home x-route="/"></x-home>

    <!-- Documentation pages -->
    <x-docs x-route="/docs/*"></x-docs>

  </main>

  <!-- Footer (visible on every route) -->
  <x-footer x-route="/"></x-footer>

</body>

</html>
