<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Manifest</title>
  <meta name="description" content="Supercharge HTML for rapid, feature-rich website and web app development.">
  <meta name="author" content="Andrew Matlock">
  <meta name="robots" content="index, follow">
  <meta name="googlebot" content="index, follow">
  <meta name="google" content="notranslate">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/Manrope.woff2" crossorigin>

  <!-- Web App & Manifest -->
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="/manifest.json">

  <!-- Styles -->
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Lexend+Exa&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Lexend+Exa&display=swap">
  </noscript>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mnfst@0.5.130/lib/manifest.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mnfst@0.5.130/lib/manifest.code.min.css">
  <link rel="stylesheet" href="/manifest.theme.css">

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/appwrite@latest" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/mnfst@0.5.130/lib/manifest.min.js" data-tailwind data-version="0.5.130"></script>
  <script src="/scripts/payments-demo.js"></script>
  <script src="/scripts/hero-editor.js" defer></script>
  <script src="/scripts/console-message.js" defer></script>
  <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token":"0aee08ae352b431ebdc403752ba2ac41"}'></script>

</head>

<body x-data="{
  init() {
    const savedDirection = localStorage.getItem('manifest-direction') || 'auto';
    document.documentElement.setAttribute('dir', savedDirection);
  }
}" class="bg-surface-1">

  <x-header></x-header>

  <main class="pt-[69px] px-viewport-padding dark:bg-surface-1" :class="$route === '/' ? 'bg-surface-1' : ''">

    <!-- Home page -->
    <x-home x-route="/"></x-home>

    <!-- Documentation pages -->
    <x-docs x-route="/docs/*"></x-docs>

  </main>

  <!-- Footer (visible on every route) -->
  <x-footer x-route="/"></x-footer>

</body>

</html>
