<div class="col w-content-width max-w-full mx-auto pt-12 pb-[30vh]">

  <!-- Legal home -->
  <div x-route="=legal" class="col gap-8 w-2xl max-w-full">
    <div class="col gap-3">
      <h1>Legal</h1>
      <p class="text-content-neutral">The agreements and policies that govern Manifest services, operated by MNFST OÜ.</p>
    </div>
    <div class="grid gap-3 sm:grid-cols-2">
      <a href="/legal/privacy" class="row items-center gap-3 px-4 py-3 rounded-lg border border-line bg-page hover:bg-surface-2 no-underline">
        <span x-icon="lucide:shield-check" class="text-brand-content"></span>
        <span class="text-content-stark font-medium">Privacy Policy</span>
      </a>
      <a href="/legal/terms" class="row items-center gap-3 px-4 py-3 rounded-lg border border-line bg-page hover:bg-surface-2 no-underline">
        <span x-icon="lucide:file-check" class="text-brand-content"></span>
        <span class="text-content-stark font-medium">Terms of Service</span>
      </a>
    </div>
  </div>

  <!-- Privacy Policy -->
  <div x-route="=legal/privacy" class="col w-full" x-data="{ doc: '' }"
    x-init="(window.__manifestReady ? Promise.resolve() : new Promise(r => addEventListener('manifest:ready', r, { once: true }))).then(() => doc = '/articles/legal/privacy.md')">
    <div class="prose mx-auto" x-markdown="doc"></div>
  </div>

  <!-- Terms of Service -->
  <div x-route="=legal/terms" class="col w-full" x-data="{ doc: '' }"
    x-init="(window.__manifestReady ? Promise.resolve() : new Promise(r => addEventListener('manifest:ready', r, { once: true }))).then(() => doc = '/articles/legal/terms.md')">
    <div class="prose mx-auto" x-markdown="doc"></div>
  </div>

</div>
