<div class="col md:row justify-between gap-4 w-full max-w-full mx-auto">

  <!-- Desktop Navigation-->
  <div data-static style="view-transition-name: docs-nav-desktop" class="shrink-0 hidden md:block sticky top-[60px] w-64 max-h-[calc(100vh-69px)] pt-12 pb-64 pr-10 overflow-y-auto no-scrollbar"
    x-data x-init="(async () => { for (let i = 0; i < 30; i++) { const a = $el.querySelector('a.pointer-events-none'); if (a) { $el.scrollTop = Math.max(0, a.offsetTop - $el.clientHeight / 2); break } await new Promise(r => setTimeout(r, 100)) } })()">
    <template x-for="group in $x.docs" :key="group.group">
      <div class="col gap-2">
        <small class="pl-2.5 text-content-subtle" x-text="group.group"></small>
        <div class="col">
          <template x-for="(item, index) in group.items" :key="item.path || index">
            <a x-show="item.name" :href="'/docs/' + group.group.toLowerCase().replaceAll(' ', '-') + '/' + item.path" role="button" :class="[
                  $x.docs.$route('path') && $x.docs.$route('path').path === item.path
                    ? 'text-brand-content bg-brand-surface/35 dark:bg-brand-surface/15  pointer-events-none'
                    : 'ghost text-content-neutral',
                  'justify-start w-full',
                  item.indent ? 'text-content-subtle' : ''
                ]">

              <span x-icon="item.icon" x-show="item.icon"></span>
              <span x-text="item.name"></span>
            </a>
          </template>
        </div>
        <hr class="mt-4 mb-8">
      </div>
    </template>
  </div>

  <!-- Articles -->
  <div class="col justify-between max-w-full md:max-w-[calc(100%-17rem)] mx-auto pt-12 pb-[30vh]">

    <div class="col max-w-full mx-auto">

      <!-- Eyebrow Group Name -->
      <template x-if="$x.docs.$route('path')">
        <span class="h6 mb-3" x-text="$x.docs.$route('path')?.group || 'No group'"></span>
      </template>

      <!-- Markdown Document for Route -->
      <template x-if="$x.docs.$route('path')">
        <div class="prose [&_:where(h1,h2,h3)]:scroll-mt-26" x-markdown="$x.docs.$route('path')?.doc"></div>
      </template>

    </div>

    <!-- Default Content — `x-if` (not `x-show`) so the fallback is REMOVED from the DOM on valid routes, instead of just `display:none`. Otherwise every prerendered article page ships the "Article does not exist" text alongside its real content, which crawlers/AI scrapers see as duplicate/contradictory content. -->
    <template x-if="!$x.docs.$route('path')">
      <div class="w-3xl max-w-full mx-auto text-center prose">
        <h1>Article does not exist</h1>
        <p>There is no documentation at this path.</p>
      </div>
    </template>

    <!-- Article Footer -->
    <footer class="mt-20">
      <hr>
      <div class="row-wrap justify-between items-center gap-4 pt-4">

        <!-- Start -->
        <figcaption class="text-content-subtle">&copy; 2026 <a href="https://andrewmatlock.com" target="_blank" rel="noopener">Andrew
            Matlock</a> • <a href="/docs/resources/license">MIT License</a>
        </figcaption>

        <!-- End -->
        <div class="row-wrap gap-3">

          <!-- GitHub-->
          <a href="https://github.com/Manifest-X/Manifest" target="_blank" role="button" class="sm ghost outlined rounded-full" aria-label="GitHub" x-icon="simple-icons:github"></a>

          <!-- Color mode -->
          <div role="group" class="outlined rounded-full">
            <button x-color="'light'" class="sm rounded-s-full" :class="$color.current === 'light' ? 'bg-brand-surface/50 dark:bg-brand-surface/35  text-brand-content pointer-events-none' : 'ghost'" x-icon="lucide:sun" aria-label="Light mode"></button>
            <button x-color="'dark'" class="sm ghost" :class="$color.current === 'dark' ? 'bg-brand-surface/50 dark:bg-brand-surface/35  text-brand-content pointer-events-none' : 'ghost'" x-icon="lucide:moon" aria-label="Dark mode"></button>
            <button x-color="'system'" class="sm ghost rounded-e-full" :class="$color.current === 'system' ? 'bg-brand-surface/50 dark:bg-brand-surface/35  text-brand-content pointer-events-none' : 'ghost'" x-icon="lucide:sun-moon" aria-label="Auto mode"></button>

          </div>
        </div>
      </div>
    </footer>

  </div>

  <!-- Anchor Links -->
  <div data-static style="view-transition-name: docs-toc" class="hidden xl:col gap-2.5 sticky top-[60px] w-64 max-h-[calc(100vh-69px)] pt-10 pb-64 pl-10 overflow-y-auto no-scrollbar">

    <small class="mb-2" x-show="$store.anchors?.count > 0">
      <span x-icon="lucide:align-left" class="[dir=rtl]:rotate-180"></span>
      <span>On this page</span>
    </small>

    <template x-anchors=".prose | h2, h3">
      <div class="col gap-1.5" x-show="$store.anchors?.count > 0">
        <a :href="anchor.link" class="text-content-subtle hover:text-content-neutral text-sm no-underline block mb-2" :class="{
                'pl-2': anchor.tag === 'h3',
                '!text-content-stark font-medium': anchor.selected
              }" x-text="anchor.text">
        </a>
      </div>
    </template>

  </div>

</div>
