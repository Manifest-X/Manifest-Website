<header style="view-transition-name: site-header" class="fixed top-0 left-0 right-0 z-5 max-w-screen px-viewport-padding bg-surface-1/65 backdrop-blur-xl">

    <!-- Content Area -->
    <nav class="row md:grid md:grid-cols-3 justify-between items-center gap-4 max-w-full mx-auto py-4" :class="$route === '/' ? 'w-content-width' : 'w-full'">

        <!-- Start -->
        <div class="row items-center gap-3" x-data="{
            families: { ai: 'AI Plugin', framework: 'Framework', api: 'API' },
            get family() { return $route.startsWith('/docs/ai') ? 'ai' : $route.startsWith('/docs/api') ? 'api' : 'framework' },
        }">

            <!-- Logo -->
            <a href="/#home" class="w-fit no-underline text-lg font-semibold tracking-tighter">
                <span class="hidden md:flex">{Manifest}</span>
                <span class="md:hidden">{M}</span>
            </a>

            <!-- Docs family -->
            <button x-route="docs/*" x-dropdown="docs-family" class="sm ghost rounded-full" aria-label="Switch documentation">
                <span x-text="families[family]"></span>
                <span x-icon="lucide:chevrons-up-down" class="text-content-subtle"></span>
            </button>
            <menu popover id="docs-family">
                <template x-for="(label, key) in families" :key="key">
                    <a :href="'/docs/' + key" close>
                        <span x-text="label"></span>
                        <span x-show="family === key" x-icon="lucide:check" class="trailing"></span>
                    </a>
                </template>
            </menu>

            <!-- Docs Breadcrumbs-->
            <small class="hidden sm:flex md:hidden items-center truncate" x-route="docs/ai/*">
                <template x-if="$x.ai.$route('path')?.group">
                    <span class="row items-center"><span x-text="$x.ai.$route('path')?.group"></span><span class="mx-1.5" x-icon="lucide:chevron-right"></span></span>
                </template>
                <span class="text-content-stark" x-text="$x.ai.$route('path')?.name || 'No article'"></span>
            </small>
            <small class="hidden sm:flex md:hidden items-center truncate" x-route="docs/api/*">
                <template x-if="$x.api.$route('path')?.group">
                    <span class="row items-center"><span x-text="$x.api.$route('path')?.group"></span><span class="mx-1.5" x-icon="lucide:chevron-right"></span></span>
                </template>
                <span class="text-content-stark" x-text="$x.api.$route('path')?.name || 'No article'"></span>
            </small>
            <small class="hidden sm:flex md:hidden items-center truncate" x-route="docs/framework/*">
                <span x-text="$x.framework.$route('path')?.group || 'No group'"></span>
                <span class="mx-1.5" x-icon="lucide:chevron-right"></span>
                <span class="text-content-stark" x-text="$x.framework.$route('path')?.name || 'No article'"></span>
            </small>

        </div>

        <!-- Middle -->
        <div class="hidden md:row justify-center items-center gap-6 no-underline" x-route="/">
            <a href="#features" class="text-sm no-underline">Features</a>
            <a href="#comparisons" class="text-sm no-underline">Comparisons</a>
            <a href="#faq" class="text-sm no-underline">FAQ</a>
        </div>
        <div x-route="!/"></div>

        <!-- End -->
        <div class="row justify-end items-center gap-2">

            <!-- CTAs -->
            <button popovertarget="docs-search" class="sm transparent outlined rounded-full" aria-label="Search docs">
                <span x-icon="lucide:search"></span>
                <span class="hidden md:inline text-xs text-content-subtle">⌘K</span>
            </button>
            <a role="button" href="https://github.com/Manifest-X/Manifest" target="_blank" class="sm transparent outlined rounded-full" aria-label="GitHub"><span x-icon="meteor-icons:github"></span><span class="hidden sm:inline">GitHub</span></a>
            <a role="button" href="https://dash.manifestx.dev" class="hidden lg:flex sm transparent outlined rounded-full">Dashboard</a>
            <a role="button" href="/docs" class="sm accent rounded-full">Docs</a>

            <!-- Mobile Sidebar Button -->
            <button class="ghost flex md:hidden" popovertarget="docs-nav" x-icon="lucide:menu" aria-label="Mobile Navigation"></button>

        </div>

    </nav>

</header>
