<div class="col md:row justify-between gap-4 w-full max-w-full mx-auto">

  <!-- Desktop Navigation-->
  <nav aria-label="Documentation" data-static style="view-transition-name: docs-nav-desktop" class="shrink-0 hidden md:block sticky top-[60px] w-64 max-h-[calc(100vh-69px)] pt-12 pb-64 pr-10 overflow-y-auto no-scrollbar"
    x-data x-init="(window.__manifestReady ? Promise.resolve() : new Promise(r => addEventListener('manifest:ready', r, { once: true }))).then(() => { const a = $el.querySelector('[aria-current=page]'); if (a) $el.scrollTop = Math.max(0, a.offsetTop - $el.clientHeight / 2) })">
    <template x-for="group in $x.docs" :key="group.group">
      <div class="col gap-2">
        <small class="pl-2.5 text-content-subtle" x-text="group.group"></small>
        <div class="col">
          <template x-for="(item, index) in group.items" :key="item.path || index">
            <a x-show="item.name" :href="'/docs/' + group.slug + '/' + item.path" role="button" :aria-current="$x.docs.$route('path') && $x.docs.$route('path').path === item.path ? 'page' : null" :class="[
                  $x.docs.$route('path') && $x.docs.$route('path').path === item.path
                    ? 'text-brand-content bg-brand-surface/35 dark:bg-brand-surface/15  pointer-events-none'
                    : 'ghost text-content-neutral',
                  'justify-start w-full',
                  item.indent ? 'text-content-subtle' : ''
                ]">

              <span x-icon="item.icon" x-show="item.icon"></span>
              <span x-text="item.name"></span>
            </a>
          </template>
        </div>
        <hr class="mt-4 mb-8">
      </div>
    </template>
  </nav>

  <!-- Articles -->
  <div class="col grow min-w-0 max-w-full md:max-w-[calc(100%-17rem)] pt-12 pb-[30vh]">

    <div class="col grow w-full max-w-full">

      <!-- Eyebrow Group Name -->
      <template x-if="$x.docs.$route('path')?.name">
        <span class="h6 mb-3" x-text="$x.docs.$route('path')?.group || 'No group'"></span>
      </template>

      <!-- Markdown Document for Route -->
      <template x-if="$x.docs.$route('path')?.name">
        <div class="prose [&_:where(h1,h2,h3)]:scroll-mt-26" x-markdown="$x.docs.$route('path')?.doc"></div>
      </template>

      <!-- Docs home -->
      <template x-if="$route.replace(/\/$/, '') === '/docs'">
        <div class="col gap-8">
          <div class="col gap-3 max-w-2xl">
            <h1>Docs</h1>
            <p class="text-content-neutral">Everything you need to build with Manifest — setup guides, plugins, pre-styled elements, and reference.</p>
          </div>
          <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
            <template x-for="group in $x.docs" :key="group.group">
              <a :href="'/docs/' + group.slug" class="row items-center gap-3 px-4 py-3 rounded-lg border border-line bg-page hover:bg-surface-2 no-underline">
                <span x-icon="group.items?.[0]?.icon" class="text-brand-content"></span>
                <span class="col">
                  <span class="text-content-stark font-medium" x-text="group.group"></span>
                  <small class="text-content-subtle" x-text="group.items.filter(i => i.name).length + ' articles'"></small>
                </span>
              </a>
            </template>
          </div>
        </div>
      </template>

      <!-- Group landing -->
      <template x-if="$x.docs.$route('slug')?.group">
        <div class="col gap-8" x-data="{ get group() { return $x.docs.$route('slug') } }">
          <div class="col gap-3 max-w-2xl">
            <h1 x-text="group?.group"></h1>
            <p class="text-content-neutral" x-text="group?.description"></p>
          </div>
          <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
            <template x-for="(item, index) in group?.items.filter(i => i.name) || []" :key="item.path || index">
              <a :href="'/docs/' + group.slug + '/' + item.path" class="row items-center gap-2.5 px-4 py-2.5 rounded-lg border border-line bg-page hover:bg-surface-2 no-underline">
                <span x-icon="item.icon" x-show="item.icon" class="text-brand-content"></span>
                <span class="text-content-stark" x-text="item.name"></span>
              </a>
            </template>
          </div>
        </div>
      </template>

    </div>

    <!-- Fallback — x-if so prerendered article pages don't ship it as duplicate content -->
    <template x-if="!$x.docs.$route('path')?.name && !$x.docs.$route('slug')?.group && $route.replace(/\/$/, '') !== '/docs'">
      <div class="max-w-full prose">
        <h1>Article does not exist</h1>
        <p>There is no documentation at this path.</p>
      </div>
    </template>

    <!-- Article Footer -->
    <footer class="mt-20">
      <hr>
      <div class="row-wrap justify-between items-center gap-4 pt-4">

        <!-- Start -->
        <figcaption class="text-content-subtle">&copy; 2026 <a href="https://andrewmatlock.com" target="_blank" rel="noopener">Andrew
            Matlock</a> • <a href="/docs/resources/license">MIT License</a>
        </figcaption>

        <!-- End -->
        <div class="row-wrap gap-3">

          <!-- GitHub-->
          <a href="https://github.com/Manifest-X/Manifest" target="_blank" role="button" class="sm ghost outlined rounded-full" aria-label="GitHub" x-icon="simple-icons:github"></a>

          <!-- Color mode -->
          <div role="group" class="outlined rounded-full">
            <button x-color="'light'" class="sm rounded-s-full" :class="$color.current === 'light' ? 'bg-brand-surface/50 dark:bg-brand-surface/35  text-brand-content pointer-events-none' : 'ghost'" x-icon="lucide:sun" aria-label="Light mode"></button>
            <button x-color="'dark'" class="sm ghost" :class="$color.current === 'dark' ? 'bg-brand-surface/50 dark:bg-brand-surface/35  text-brand-content pointer-events-none' : 'ghost'" x-icon="lucide:moon" aria-label="Dark mode"></button>
            <button x-color="'system'" class="sm ghost rounded-e-full" :class="$color.current === 'system' ? 'bg-brand-surface/50 dark:bg-brand-surface/35  text-brand-content pointer-events-none' : 'ghost'" x-icon="lucide:sun-moon" aria-label="Auto mode"></button>

          </div>
        </div>
      </div>
    </footer>

  </div>

  <!-- Anchor Links -->
  <nav aria-label="On this page" data-static style="view-transition-name: docs-toc" class="hidden xl:col gap-2.5 sticky top-[60px] w-64 max-h-[calc(100vh-69px)] pt-10 pb-64 pl-10 overflow-y-auto no-scrollbar">

    <small class="mb-2" x-show="$store.anchors?.count > 0">
      <span x-icon="lucide:align-left" class="[dir=rtl]:rotate-180"></span>
      <span>On this page</span>
    </small>

    <template x-anchors=".prose | h2, h3">
      <div class="col gap-1.5" x-show="$store.anchors?.count > 0">
        <a :href="anchor.link" class="text-content-subtle hover:text-content-neutral text-sm no-underline block mb-2" :class="{
                'pl-2': anchor.tag === 'h3',
                '!text-content-stark font-medium': anchor.selected
              }" x-text="anchor.text">
        </a>
      </div>
    </template>

  </nav>

</div>
