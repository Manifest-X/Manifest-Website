<!DOCTYPE html>
<html lang="en"><head>
  <script id="manifest-theme-bootstrap">(function(){try{var t=localStorage.getItem('theme')||'system';var d=t==='dark'||(t==='system'&&window.matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.classList.add(d?'dark':'light');}catch(e){document.documentElement.classList.add('light');}})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Manifest</title>
  <meta name="description" content="Supercharge HTML for rapid, feature-rich website and web app development.">
  <meta name="author" content="Andrew Matlock">
  <meta name="robots" content="index, follow">
  <meta name="googlebot" content="index, follow">
  <meta name="google" content="notranslate">
  <link rel="icon" href="../../../favicon.ico" sizes="any">

  <!-- Preload Manrope (referenced by manifest.theme.css's @font-face) so the
       UI font is fetched in parallel with HTML parsing instead of after the
       CSS resolves — avoids the late-swap layout shift PageSpeed measured. -->
  <link rel="preload" as="font" type="font/woff2" href="../../../assets/fonts/Manrope.woff2" crossorigin="">

  <!-- Web App & Manifest -->
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="../../../manifest.json">

  <!-- Styles -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&amp;family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&amp;family=Lexend+Exa&amp;display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Lexend+Exa&display=swap">
  </noscript>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mnfst@0.5.117/lib/manifest.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mnfst@0.5.117/lib/manifest.code.min.css">
  <link rel="stylesheet" href="../../../manifest.theme.css">

  <!-- Scripts -->
  <!-- Appwrite is only used inside docs/dashboard routes; defer so it doesn't block
       the homepage's main thread (PageSpeed flagged 24.8 KiB of unused JS here). -->
  <script src="https://cdn.jsdelivr.net/npm/appwrite@latest" defer=""></script>
  <script src="https://cdn.jsdelivr.net/npm/mnfst@0.5.117/lib/manifest.min.js" data-version="0.5.117"></script>
  <script src="../../../scripts/hero-editor.js" defer=""></script>
  <script src="../../../scripts/console-message.js" defer=""></script>

<link rel="canonical" href="https://manifestx.dev/docs/getting-started/introduction">
<meta name="manifest:router-base" content="">
<meta name="manifest:prerender-locales" content="en">
<meta name="manifest:prerendered" content="1">
<meta name="manifest:router-base-depth" content="3">
<link rel="stylesheet" href="/prerender.utilities.css">
</head>

<body x-data="{
  init() {
    const savedDirection = localStorage.getItem('manifest-direction') || 'auto';
    document.documentElement.setAttribute('dir', savedDirection);
  }
}" class="bg-surface-1">

  <x-header data-pre-rendered="1"></x-header>

  <main class="pt-[69px] px-viewport-padding dark:bg-surface-1" :class="$route === '/' ? 'bg-surface-1' : ''">

    <!-- Home page -->
    <x-home x-route="/" data-pre-rendered="1"></x-home>

    <!-- Documentation pages -->
    <x-docs x-route="/docs/*" data-pre-rendered="1"></x-docs>

  </main>

  <!-- Footer (visible on every route) -->
  <x-footer x-route="/" data-pre-rendered="1"></x-footer>



</body></html>
