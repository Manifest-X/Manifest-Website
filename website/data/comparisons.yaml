# Comparison matrix. Each row is an aspect; columns are frameworks.
# Manifest column is rendered first and highlighted in the table layout.
#
# Rendering conventions:
# - A cell value starting with "✓" renders as a check icon followed by any
#   parenthetical detail. e.g. "✓"          → ✓
#                              "✓ (.d.ts)"  → ✓ (.d.ts)
# - All other strings render as plain text.
# - Use "—" for features the framework does not provide and that the developer
#   has to build themselves.

summaryRows:
- aspect: "Build step"
  manifest: "None"
  react: "Required"
  vue: "Required"
  htmx: "None"
  astro: "Required"
  alpine: "None"

- aspect: "Components"
  manifest: "HTML files"
  react: ".jsx / .tsx files"
  vue: ".vue files"
  htmx: "Server partials"
  astro: ".astro files"
  alpine: "—"

- aspect: "Reactivity"
  manifest: "✓"
  react: "✓"
  vue: "✓"
  htmx: "Via server"
  astro: "Per island"
  alpine: "✓"

- aspect: "Routing"
  manifest: "✓"
  react: "Add-on"
  vue: "Add-on"
  htmx: "Server-side"
  astro: "✓"
  alpine: "Add-on"

- aspect: "Localization"
