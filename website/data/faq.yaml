- question: "What is Manifest?"
  answer: "An HTML-first framework for production sites and apps. It packs all the functionality of modern frameworks, from a single runtime script tag and stylesheet. No build pipeline, no framework lock-in."

- question: "Who is Manifest for?"
  answer: "Developers who want the web platform back as a first-class surface, and anyone building with AI coding agents. Build marketing sites, docs, dashboards, apps, and full enterprise platforms."

- question: "Is it SEO/AEO optimized?"
  answer: "Yes, Manifest was built specifically with performance and crawlability in mind. An optional CLI command generates an <a href='/docs/publishing/websites'>optimized website</a> with all files, links, canonicals, metas, and OG assets compiled."

- question: "Is Manifest free?"
  answer: "Yes, Manifest is MIT-licensed for any use. A supplementary AI toolkit is currently in beta, to be available on both free and paid tiers."