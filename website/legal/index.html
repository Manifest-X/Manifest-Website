  <div x-data="{
        sources: [['platform', '/docs/platform'], ['framework', '/docs/framework'], ['api', '/docs/api']],
        labels: { platform: 'Platform', framework: 'Framework', api: 'API' },
        q: '',
        items: [],
        ready: false,
        loading: false,
        active: 0,

        // Fetch every article's markdown once, on first open; index title, description, headings, body.
        async build() {
            if (this.ready || this.loading) return;
            this.loading = true;
            const jobs = [];
            for (const [src, base] of this.sources) {
            for (let i = 0; i &lt; 20 &amp;&amp; (!$x[src] || !$x[src].length); i++) await new Promise(r =&gt; setTimeout(r, 100));
            for (const g of ($x[src] || [])) {
                for (const it of (g.items || [])) {
                    if (!it.name || !it.doc) continue;
                    const href = base + (g.slug ? '/' + g.slug : '') + '/' + it.path;
                    jobs.push(fetch(it.doc)
                        .then(r =&gt; r.ok ? r.text() : '')
                        .catch(() =&gt; '')
                        .then(md =&gt; {
                            const desc = (md.match(/^#\s.+\n+([^#\n][^\n]*)/m)?.[1] || '')
                                .replace(/&lt;[^&gt;]+&gt;/g, '').replace(/[*_`\[\]]/g, '').trim();
                            const headings = [...md.matchAll(/^#{2,3}\s+(.+)$/gm)].map(m =&gt; m[1].trim());
                            const body = md
                                .replace(/```[\s\S]*?```/g, ' ')
                                .replace(/:::[^\n]*/g, ' ')
                                .replace(/&lt;[^&gt;]+&gt;/g, ' ')
                                .replace(/[#&gt;*_`\[\]()|]/g, ' ')
                                .replace(/-{2,}/g, ' ')
                                .replace(/\s+/g, ' ');
                            this.items.push({
                                name: it.name, group: g.group, icon: it.icon, href, desc, src,
                                headings,
                                hhay: headings.join(' · ').toLowerCase(),
                                body, bhay: body.toLowerCase(),
                            });
                        }));
                }
            }
            }
            await Promise.all(jobs);
            $x.$register('searchIndex', this.items);
            this.ready = true;
            this.loading = false;
        },

        results() {
            const terms = this.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
            if (!terms.length) return this.items.map(it =&gt; ({ ...it, caption: it.desc }));
            const ranked = $x.searchIndex.$search(this.q, { name: 100, hhay: 40, bhay: 15 });
            return ranked.slice(0, 20).map(it =&gt; ({ ...it, caption: this.caption(it, terms[0]) }));
        },

        // Matched heading, content excerpt, or the article description.
        caption(it, t0) {
            const h = it.headings.find(h =&gt; h.toLowerCase().includes(t0));
            if (h) return h;
            if (!it.name.toLowerCase().includes(t0)) {
                const i = it.bhay.indexOf(t0);
                if (i &gt; -1) return (i &gt; 30 ? '…' : '') + it.body.slice(Math.max(0, i - 30), i + 70).trim() + '…';
            }
            return it.desc;
        },

        openDialog() { document.getElementById('docs-search')?.showPopover(); },
        // The router swallows result clicks before element handlers run, so the
        // dialog closes on the route-change event rather than the click itself.
        closeDialog() { try { document.getElementById('docs-search')?.hidePopover(); } catch (e) { } },
        async onToggle(e) {
            if (e.newState !== 'open') return;
            this.$nextTick(() =&gt; { this.$refs.input.focus(); this.$refs.input.select(); });
            await this.build();
            this.$nextTick(() =&gt; { if (this.$refs.list) this.$refs.list.scrollTop = 0; });
        },
        move(d) {
            const n = this.results().length;
            if (!n) return;
            this.active = (this.active + d + n) % n;
            this.$nextTick(() =&gt; this.$refs.list?.querySelector('[data-active]')?.scrollIntoView({ block: 'nearest' }));
        },
        go() { this.$refs.list?.querySelector('[data-active] a')?.click(); },
    }" x-init="$watch('q', () =&gt; active = 0)" @keydown.window.meta.k.prevent="openDialog()" @keydown.window.ctrl.k.prevent="openDialog()" @manifest:route-change.window="closeDialog()" data-component="docs-search-1" data-order="2">

    <dialog popover="" id="docs-search" @toggle="onToggle($event)" @keydown.down.prevent="move(1)" @keydown.up.prevent="move(-1)" @keydown.enter.prevent="go()" class="col gap-0 p-0 w-[min(38rem,92vw)] h-[min(30rem,80vh)] overflow-hidden">

        <!-- Query -->
        <div class="shrink-0 px-4 pt-4 pb-3 border-b border-line">
            <label class="row items-center gap-2 w-full">
                <span x-icon="lucide:search" class="text-content-subtle shrink-0"></span>
                <input x-ref="input" type="search" x-model="q" placeholder="Search docs">
            </label>
        </div>

        <!-- Results -->
        <div x-ref="list" class="col grow overflow-y-auto no-scrollbar px-4 [overflow-anchor:none]">
            <div class="h-2 shrink-0"></div>
            <p x-show="loading &amp;&amp; !ready" class="px-3 py-2 text-sm text-content-subtle" style="display: none">Indexing articles…</p>
            <p x-show="ready &amp;&amp; q.trim() &amp;&amp; !results().length" class="px-3 py-2 text-sm text-content-subtle" style="display: none">

            <template x-for="(r, i) in results()" :key="r.href" data-prerender-collapsed="1">

                        </span>
                    </a>
                </div>
            </template>
            <div class="h-2 shrink-0"></div>
        </div>

    </dialog>
</div>

                    <hr>

            <div class="col">
