# Single-matrix comparison.  Each row is an aspect; columns are frameworks.
# Manifest column is rendered first / highlighted in the table layout.
rows:
  - aspect: "Build step"
    manifest: "None"
    react: "Required (Vite/Next)"
    vue: "Required (Vite)"
    htmx: "Server-side"
    astro: "Required (Node)"
    alpine: "None"

  - aspect: "Runtime size"
    manifest: "~30 KB"
    react: "~40 KB+"
    vue: "~35 KB"
    htmx: "~14 KB"
    astro: "Per-island"
    alpine: "~15 KB"

  - aspect: "Component model"
    manifest: "HTML files"
    react: "JSX + JS"
    vue: ".vue files"
    htmx: "Server partials"
    astro: ".astro + islands"
    alpine: "Manual"

  - aspect: "Reactivity"
    manifest: "$x + x-data"
    react: "Hooks"
    vue: "ref / reactive"
    htmx: "Server round-trip"
    astro: "Framework islands"
    alpine: "x-data"

  - aspect: "Routing"
    manifest: "Built in"
    react: "react-router"
    vue: "vue-router"
    htmx: "Server-side"
    astro: "Built in"
    alpine: "Plugin"

  - aspect: "Data sources"
    manifest: "YAML / JSON / CSV / API"
    react: "Manual fetch"
    vue: "Manual fetch"
    htmx: "Server-rendered"
    astro: "Astro DB / fetch"
    alpine: "Manual fetch"

  - aspect: "Static rendering"
    manifest: "Built in"
    react: "Next.js / Remix"
    vue: "Nuxt / VitePress"
    htmx: "Not the focus"
    astro: "Built in"
    alpine: "Not provided"

  - aspect: "Localization"
    manifest: "Built in"
    react: "i18next"
    vue: "vue-i18n"
    htmx: "Server-side"
    astro: "astro-i18next"
    alpine: "Manual"

  - aspect: "AI editor integration"
    manifest: "Manifest AI"
    react: "None"
    vue: "None"
    htmx: "None"
    astro: "None"
    alpine: "None"

  - aspect: "Learning curve"
    manifest: "Shallow"
    react: "Steep"
    vue: "Medium"
    htmx: "Shallow"
    astro: "Medium"
    alpine: "Shallow"
