  highlights:
    - value: "Free"
      text: "Publish on your own domain, with staging, on the free plan."
    - value: "No seats"
      text: "Teammates join a Pro project without a fee per person."
    - value: "$15"
      text: "A month per project, only for projects that need Pro."

  chooseThem:
    - "You want to design by hand on a canvas."
    - "Your team already works in Webflow's Designer."
    - "You already use Webflow's CMS."
  chooseUs:
    - "You'd rather describe changes than drag them."
    - "You want a free custom domain and staging."
    - "You want teammates without per-seat fees."

  free:
    - [ "Build with AI", "200 credits a month", "Your Claude plan" ]
    - [ "Design and layout", "On a canvas", "By chatting" ]
    - [ "Publish online", "✓", "✓" ]
    - [ "Custom domain", "—", "✓" ]
    - [ "Form submissions", "50", "100 a month" ]
    - [ "Site analytics", "—", "Last 7 days" ]
    - [ "Take your code elsewhere", "Paid plan only", "✓" ]
    - [ "Branding badge", "Shown", "Shown" ]

  paid:
    - [ "Price", "From $25 a month", "$15 a month per project" ]
    - [ "Build with AI", "Monthly credits, plus top-ups", "Your Claude plan" ]
    - [ "Design and layout", "On a canvas", "By chatting" ]
    - [ "Custom domain", "✓", "✓" ]
    - [ "Branding badge removed", "✓", "✓" ]
    - [ "Manage content", "CMS from $39 a month", "Ask Claude" ]
    - [ "Teammates who edit", "From $19 a month each", "✓" ]
    - [ "Site analytics", "Add-on, from $12 a month", "All time" ]

  switch:
    intro: "There's nothing to export. Point Claude at your published Webflow site, and it copies it into a new Manifest project."
    steps:
      - title: "Connect Manifest"
        text: "Add Manifest to Claude once, in a minute."
      - title: "Point Claude at it"
        text: "Give Claude your Webflow site's address and ask for a copy."
      - title: "Publish"
        text: "Check it on staging, then take it live on your own domain."
    prompts:
      - "Copy my-site.webflow.io into a new Manifest project, exactly as it is"

  faq:
    - q: "Is Manifest cheaper than Webflow?"
      a: "Yes, and it stays that way. Manifest's free plan has no time limit: build in Claude and publish on your own domain for $0, month after month. Pro is $15 a month per project, with teammates included. On Webflow, a custom domain needs a paid site plan, from $25 a month, or $15 billed yearly, its CMS starts at $39 a month, and each teammate who edits is a paid seat."
    - q: "Does Manifest use credits?"
      a: "No. Building happens in your Claude chats."
    - q: "Can I move a Webflow site to Manifest?"
      a: "Yes. Give Claude your Webflow site's address and ask for a copy in a new Manifest project. It's rebuilt as yours, ready to edit and publish. A Webflow code export can also be published as it is."
    - q: "Does Manifest have a visual editor like Webflow?"
      a: "Claude is the designer. Describe the change, and see it in a live preview, then publish. Teammates you invite do the same, from their own Claude. If you'd rather drag and style every element by hand, Webflow is built for that."
    - q: "Can I use my own domain for free?"
      a: "Yes, on Manifest's free plan, with the certificate handled for you. Webflow needs a paid site plan for each site on a custom domain."
    - q: "What happens to my Webflow CMS content?"
      a: "Claude copies it, blog posts and other lists included, into data your new project reads, stored with the project or in the cloud. From then on, Claude is your CMS: ask it to add a post or change a price. Need a dashboard for others? Claude can build you a custom CMS in minutes, hosted on Manifest, that updates your site."

