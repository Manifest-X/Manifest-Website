# One entry per comparison page, served at /compare/<slug>.
# Table and plan cells: "✓" renders as a check, "—" as not offered, anything else as text.
- slug: "lovable"
  blurb: "Build without spending credits on every request."
  name: "Lovable"
  summary: "Both build apps by chatting with AI. Lovable spends credits on every request. Manifest builds through the Claude plan you already have, and publishing is free."
  verified: "November 2026"
  sources:
    - label: "Lovable pricing"
      url: "https://lovable.dev/pricing"
    - label: "Lovable custom domains"
      url: "https://docs.lovable.dev/features/custom-domain"
    - label: "Lovable GitHub sync"
      url: "https://docs.lovable.dev/integrations/github"

  highlights:
    - value: "No credits"
      text: "Building runs on your Claude plan, so there's no meter to watch."
    - value: "Free"
      text: "Publish on your own domain, with staging, on the free plan."
    - value: "$15"
      text: "A month per project, only for projects that need Pro."

  # Optional credit meter, for AI builders that meter usage.
  # prompts[].them: "credit" spends one, "no" isn't available there.
  meter:
    text: "The same requests, made on both. Lovable spends a daily credit budget. Manifest builds through your Claude plan, with no meter to watch."
    unit: "credit"
    units: "credits"
    period: "today"
    out: "Out of credits today"
    none: "No credits left"
  prompts:
    - text: "Build a booking site for my studio"
      them: "credit"
    - text: "Add member sign-in"
      them: "credit"
    - text: "Make the schedule a calendar"
      them: "credit"
    - text: "Fix the mobile menu"
      them: "credit"
    - text: "Try a darker theme"
      them: "credit"
    - text: "Add a members area"
      them: "out"
    - text: "Translate it into Spanish"
      them: "out"
    - text: "Publish my existing React site"
      them: "no"

  chooseThem:
    - "You don't use Claude."
    - "You want to start from community templates."
    - "You run many small projects under one fee."
  chooseUs:
    - "You already use Claude."
    - "You'd rather not ration credits."
    - "You want a free custom domain and staging."

  free:
    - [ "Build by chatting", "5 credits a day", "Your Claude plan" ]
    - [ "Publish publicly", "Invite only, up to 10 people", "✓" ]
    - [ "Custom domain", "—", "✓" ]
    - [ "Check changes before going live", "✓", "✓" ]
    - [ "Sync code to GitHub", "✓", "✓" ]
    - [ "Publish projects built elsewhere", "—", "✓" ]
    - [ "Teammates", "✓", "—" ]
    - [ "Branding badge", "Shown", "Shown" ]

  paid:
    - [ "Price", "From $25 a month", "$15 a month per project" ]
    - [ "Build by chatting", "Monthly credits, plus top-ups", "Your Claude plan" ]
    - [ "Custom domain", "✓", "✓" ]
    - [ "Branding badge removed", "✓", "✓" ]
    - [ "Roll back a release", "✓", "✓" ]
    - [ "Teammates", "✓", "✓" ]
    - [ "Sync code to GitHub", "✓", "✓" ]
    - [ "Publish projects built elsewhere", "—", "✓" ]

  switch:
    intro: "There's nothing to export. Point Claude at your published Lovable app, and it copies it into a new Manifest project."
    steps:
      - title: "Connect Manifest"
        text: "Add Manifest to Claude once, in a minute."
      - title: "Point Claude at it"
        text: "Give Claude your Lovable app's address and ask for a copy."
      - title: "Publish"
        text: "Check it on staging, then take it live on your own domain."
    prompts:
      - "Copy my-app.lovable.app into a new Manifest project, exactly as it is"

  faq:
    - q: "Is Manifest cheaper than Lovable?"
      a: "Yes, and it stays that way. Manifest's free plan has no time limit: build your projects in Claude and publish them publicly on your own domains for $0, month after month. You only pay for Pro on a project that needs its extras, like teammates or rollback. On Lovable's free plan, only people you invite can open your site. Public sites and custom domains start at $25 a month, and building spends credits."
    - q: "Does Manifest use credits?"
      a: "No. Building happens in your Claude chats."
    - q: "Can I move a Lovable project to Manifest?"
      a: "Yes. Give Claude your Lovable app's address and ask for a copy in a new Manifest project. It's rebuilt as yours, ready to edit and publish."
    - q: "Can I use my own domain for free?"
      a: "Yes, on Manifest's free plan, with the certificate handled for you. Lovable connects new custom domains on paid plans."
    - q: "Do I need to know how to code?"
      a: "No, for either. You describe what you want in plain words, and the AI builds it."
    - q: "Do I need Claude?"
      a: "Yes. Manifest works through Claude, so one subscription covers building. Claude's free plan works too."

