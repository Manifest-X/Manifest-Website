  faq:
    - q: "How do I publish a Claude artifact on my own domain?"
      a: "Connect Manifest to Claude, then, in the same chat or with your artifact's share link, ask: \"Publish this artifact on my own domain with Manifest.\" Claude publishes it to staging for you to check, then takes it live on your domain, with the certificate handled for you. It's free, with no time limit."
    - q: "Can I host a ChatGPT canvas app on my own domain?"
      a: "Yes. Give Claude the share link, or paste the code, and ask it to publish with Manifest on your domain. ChatGPT's own Sites feature, in beta on paid plans, can also connect a domain you own."
    - q: "Can I put a Gemini canvas app on my own domain?"
      a: "Yes, the same way. Give Claude the share link, or paste the code, and ask it to publish with Manifest on your domain."
    - q: "What does Manifest add to how Claude builds?"
      a: "Manifest's skills guide Claude through building websites, apps, games, and platforms. For projects on the Manifest framework, routing, data, sign-ins, and forms are built in, so Claude doesn't have to piece together outside tools. Sign-ins and cloud data use your own Appwrite account."
    - q: "Can it become a phone app?"
      a: "Yes, for projects built with the Manifest framework. Visitors can install it from the browser like an app, and Claude can set it up for the App Store and Google Play. You build and submit it with your own developer accounts."
    - q: "Does Manifest replace Claude?"
      a: "No. Manifest works inside Claude. You keep building by chatting, exactly as you do now, and Manifest adds the publishing: hosting, your own domain, and staging. Claude's free plan works too."
    - q: "Is Manifest free?"
      a: "Yes. The free plan has no time limit: publish to staging and live on your own domain, with 7 days of visitor analytics and 100 form submissions a month, plus a small \"Made with Manifest\" badge. Pro is $15 a month per project, and only for projects that need it: it removes the badge and adds teammates, rollback and all-time analytics."
    - q: "When is a chat app's share link enough?"
      a: "For a prototype, a quick tool, or something to show a few people, a share link is instant and needs nothing set up. When it's a site people should find at your own address, with changes checked before they go live, publish it with Manifest."
