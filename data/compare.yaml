  faq:
    - q: "Is Manifest cheaper than WordPress?"
      a: "For most small sites, yes. Manifest's free plan has no time limit: build in Claude and publish on your own domain for $0, month after month, with staging included and no ads. WordPress.com's free plan has no custom domain and shows ads. Its Personal plan adds a domain from $9 a month, or $4 billed yearly, which is cheaper than Manifest Pro's $15. Staging and restoring backups start on its Business plan, $40 a month or $25 billed yearly. Self-hosted WordPress is free software, but you pay for hosting yourself."
    - q: "Can I move my WordPress site to Manifest?"
      a: "Yes. Give Claude your site's address and ask for a copy in a new Manifest project. Pages and blog posts are rebuilt as yours, ready to edit and publish. From then on, ask Claude to add a post or change a price."
    - q: "Will my site look like other WordPress sites?"
      a: "On WordPress, most sites start from a theme that many others use too, so they tend to look alike. With Manifest, you describe what you want, and Claude designs it for you, so your site looks like yours, not a template."
    - q: "Does Manifest have plugins like WordPress?"
      a: "No, there's no plugin store. Instead, ask Claude for what you need, like a contact form, a gallery or a booking button, and it builds it into your site. There's nothing to install, and nothing to keep updated."
    - q: "Can I run an online store on Manifest?"
      a: "Yes. Bring the payment provider or store account you already use, like Stripe, and Claude connects it, from a simple checkout link to a fully built-in shop. On WordPress.com, a full store starts on the $70-a-month Commerce plan."
    - q: "Who keeps my site updated and secure?"
      a: "On Manifest, there are no plugins or servers for you to look after. Claude makes the changes, and Manifest hosts the site. WordPress.com manages its own hosting and updates. On self-hosted WordPress, you or your host keep WordPress, its plugins and its security up to date."
    - q: "Can I use my own domain for free?"
      a: "Yes, on Manifest's free plan, with the certificate handled for you. WordPress.com connects custom domains on paid plans only."

