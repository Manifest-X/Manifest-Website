premier:
    # `codeLines` powers the faux code-block graphic next to each feature on
    # the home page. Each entry is one rendered line. Raw HTML / shell / JSON
    # is safe — the site-wide $hl magic (registered in /scripts/hero-editor.js)
    # syntax-highlights each line via highlight.js and the language declared
    # in `lang` (xml | css | json | bash | ...).
    - name: "Pure HTML"
      icon: "lucide:zap"
      description: "A script tag and a stylesheet. No bundler required."
      link: "/docs/getting-started/setup"
      lang: "xml"
      codeLines:
        - '<script src="https://cdn.jsdelivr.net/npm/mnfst@latest/lib/manifest.min.js" data-tailwind></script>'
        - '<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mnfst@latest/lib/manifest.min.css">'

    - name: "Universal data"
      icon: "lucide:database"
      description: "One reactive syntax for files, APIs, and cloud databases."
      link: "/docs/core-plugins/local-data"
      lang: "xml"
      codeLines:
        - '<template x-for="p in $x.products">'
        - '  <div class="card">'
        - '    <img :src="p.image">'
        - '    <h4 x-text="p.name"></h4>'
        - '    <button @click="$x.orders.$create({ product: p.$id })">Buy</button>'

    - name: "HTML components"
      icon: "lucide:blocks"
      description: "Reusable files with route bindings on any element."
      link: "/docs/core-plugins/components"
      lang: "xml"
      codeLines:
        - '<body>'
        - '  <x-header></x-header>'
        - '  <main>'
        - '    <x-home x-route="/"></x-home>'
        - '    <x-dashboard x-route="dashboard"></x-dashboard>'
        - '    <x-404 x-route="!*"></x-404>'

    - name: "SEO/AEO-ready"
      icon: "lucide:globe"
      description: "One command renders a site hyper-optimized for crawling."
      link: "/docs/publishing/websites"
      lang: "shell"
      codeLines:
        - '$ npx mnfst-render'
        - '✓ sitemap.xml + robots.txt'
        - '✓ llms.txt + llms-full.txt'
        - '✓ OG snapshots per route'
        - '✓ JSON-LD + meta tags'

