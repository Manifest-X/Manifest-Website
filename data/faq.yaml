- question: "What is Manifest?"
  answer: "An HTML-first framework for production websites and apps. Routing, components, reactive data, localization, markdown, and prerendering — built into a single script tag. No build pipeline, no framework lock-in."

- question: "Who is Manifest for?"
  answer: "Developers who want the web platform back as a first-class surface, and non-developers building with AI coding assistants. Works equally well for marketing sites, docs, dashboards, blogs, internal tools, and full applications."

- question: "Do I need a build step?"
  answer: "No. Manifest runs in the browser the moment your script tag loads. The optional `npx mnfst-render` CLI produces static HTML for SEO and AI crawlers, but it's not required during development."

- question: "Is Manifest free?"
  answer: "Yes — MIT-licensed for any use. Manifest AI also has a free Community tier; the paid Pro tier adds team workspaces and premium components."

- question: "How does Manifest compare to React, Vue, or Astro?"
  answer: "All three require a build pipeline. Manifest doesn't. You get component reuse, reactivity, and static rendering without a bundler or framework runtime. See the comparison section above for side-by-side details."

- question: "Can I use Tailwind CSS with Manifest?"
  answer: "Yes. Manifest's CSS custom-property theme coexists with Tailwind utilities. Add `data-tailwind` to the Manifest script tag and prerendering compiles Tailwind classes to static CSS automatically."

- question: "What is Manifest AI?"
  answer: "An integration that teaches your AI coding editor — Claude Code, Cursor, Windsurf, or any MCP-compatible tool — how Manifest works. Your AI generates correct Manifest code on the first try instead of guessing at framework idioms."

- question: "Is Manifest AI a replacement for ChatGPT or Claude?"
  answer: "No. You keep your existing AI subscription. Manifest AI just makes those tools fluent in Manifest — it doesn't replace them."

- question: "Is Manifest production-ready?"
  answer: "Yes. It runs this site, ships with first-class SEO and AEO support, multi-locale routing, Appwrite integration, and a tested prerender pipeline with content-hash caching for large multi-locale sites."
