- question: "What is the Manifest framework?"
  answer: "An open-source, HTML-first framework for production websites and apps. Routing, components, data, localization, and an optional cloud backend all load from one script tag and one stylesheet, with no build step."

- question: "Who is it for?"
  answer: "Anyone who wants to build for the web in plain HTML, from first-time builders to teams, and anyone working with AI coding agents. It suits marketing sites, docs, dashboards, apps, and full platforms."

- question: "Do I need Manifest hosting?"
  answer: "No. The framework runs on any static host. <a href='/docs/platform'>Manifest's platform</a> is an optional way to build and publish with Claude, and it also hosts projects built with other frameworks."

- question: "Is it free?"
  answer: "Yes. The framework is MIT-licensed for any use, commercial included. Hosting is up to you: any static host works, or <a href='/#pricing'>Manifest's free plan</a>."
